<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="seva-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="leaf-glow" x1="20%" y1="10%" x2="90%" y2="90%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6FFFA"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#022C22" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="128" height="128" rx="32" fill="url(#seva-bg)"/>
  
  <!-- Subtle inner border highlight -->
  <rect x="1.5" y="1.5" width="125" height="125" rx="30.5" stroke="#34D399" stroke-opacity="0.4" stroke-width="3"/>

  <!-- Centered Seva Leaf Mark -->
  <g transform="translate(24, 24) scale(3.33)" filter="url(#shadow)">
    <!-- Leaf outline & fill -->
    <path
      d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"
      fill="url(#leaf-glow)"
      stroke="url(#leaf-glow)"
      stroke-width="0.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <!-- Vein line inside leaf -->
    <path
      d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"
      fill="none"
      stroke="#059669"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
