<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <!-- Background squircle gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E1B4B"/>
    </linearGradient>

    <!-- Vibrant Indigo -> Cyan gradient -->
    <linearGradient id="seva-cyan" x1="20" y1="20" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>

    <!-- Warm Amber -> Rose gradient -->
    <linearGradient id="seva-amber" x1="110" y1="110" x2="30" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>

    <!-- Glow center -->
    <radialGradient id="center-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Dark rounded container -->
  <rect width="128" height="128" rx="34" fill="url(#bg-grad)"/>
  <rect x="2" y="2" width="124" height="124" rx="32" stroke="#6366F1" stroke-opacity="0.3" stroke-width="2"/>

  <!-- Centered Interlocking Motif -->
  <g transform="translate(16, 16) scale(2.4)" filter="url(#shadow)">
    <!-- Upper Rising Ribbon -->
    <path
      d="M 12 25 C 10 20 11 12 18 9 C 25 6 31 10 30 17 C 29.5 20.5 26.5 22.5 22 22.5 C 16.5 22.5 13 26 13 29.5 C 13 32 15 33.5 17.5 33.5 C 22 33.5 25 30 25.5 27.5"
      stroke="url(#seva-cyan)"
      stroke-width="3.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Lower Interlocking Ribbon -->
    <path
      d="M 28 15 C 30 20 29 28 22 31 C 15 34 9 30 10 23 C 10.5 19.5 13.5 17.5 18 17.5 C 23.5 17.5 27 14 27 10.5 C 27 8 25 6.5 22.5 6.5 C 18 6.5 15 10 14.5 12.5"
      stroke="url(#seva-amber)"
      stroke-width="3.8"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Compassion Spark Center -->
    <path
      d="M 20 16.5 Q 20 20 16.5 20 Q 20 20 20 23.5 Q 20 20 23.5 20 Q 20 20 20 16.5 Z"
      fill="url(#center-glow)"
    />
    <circle cx="20" cy="20" r="1.5" fill="#FFFFFF"/>
  </g>
</svg>
